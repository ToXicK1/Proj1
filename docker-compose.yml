# Local development stack: PostgreSQL, object storage, API, worker and frontend.
# Usage: copy .env.example to .env, set AIDLC_SECRET_KEY and the storage keys, then run `docker compose up --build`.
name: aidlc

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aidlc
      POSTGRES_PASSWORD: aidlc
      POSTGRES_DB: aidlc
    ports:
      - "${AIDLC_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidlc -d aidlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      AIDLC_DATABASE_URL: postgresql+pg8000://aidlc:aidlc@db:5432/aidlc
      AIDLC_PUBLIC_BASE_URL: http://localhost:${AIDLC_WEB_PORT:-5173}
      AIDLC_SIGNUP_MODE: ${AIDLC_SIGNUP_MODE:-shared}
      AIDLC_ACCOUNT_MODE: ${AIDLC_ACCOUNT_MODE:-managed}
      AIDLC_DEFAULT_LLM_BASE_URL: ${AIDLC_DEFAULT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      AIDLC_DEFAULT_LLM_MODEL: ${AIDLC_DEFAULT_LLM_MODEL:-qwen3-vl:4b-instruct}
      AIDLC_DEFAULT_LLM_ADAPTER: ${AIDLC_DEFAULT_LLM_ADAPTER:-openai_compatible}
      AIDLC_PROVIDER_TIMEOUT_SECONDS: ${AIDLC_PROVIDER_TIMEOUT_SECONDS:-600}
      AIDLC_SANDBOX_DIR: /sandbox-jobs
      AIDLC_STORAGE_ENDPOINT: http://objectstore:8333
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets a local model server on this machine be reached
    depends_on:
      db:
        condition: service_healthy
      objectstore:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             python -m app.bootstrap &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    volumes:
      - sandbox_jobs:/sandbox-jobs
    ports:
      - "${AIDLC_API_PORT:-8000}:8000"

  # Runs AI and system work from the job queue (RD-4). Same image as the API; it never serves requests.
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      AIDLC_DATABASE_URL: postgresql+pg8000://aidlc:aidlc@db:5432/aidlc
      AIDLC_PUBLIC_BASE_URL: http://localhost:${AIDLC_WEB_PORT:-5173}
      AIDLC_SIGNUP_MODE: ${AIDLC_SIGNUP_MODE:-shared}
      AIDLC_ACCOUNT_MODE: ${AIDLC_ACCOUNT_MODE:-managed}
      AIDLC_DEFAULT_LLM_BASE_URL: ${AIDLC_DEFAULT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      AIDLC_DEFAULT_LLM_MODEL: ${AIDLC_DEFAULT_LLM_MODEL:-qwen3-vl:4b-instruct}
      AIDLC_DEFAULT_LLM_ADAPTER: ${AIDLC_DEFAULT_LLM_ADAPTER:-openai_compatible}
      AIDLC_PROVIDER_TIMEOUT_SECONDS: ${AIDLC_PROVIDER_TIMEOUT_SECONDS:-600}
      AIDLC_SANDBOX_DIR: /sandbox-jobs
      AIDLC_STORAGE_ENDPOINT: http://objectstore:8333
      AIDLC_JOB_LEASE_SECONDS: ${AIDLC_JOB_LEASE_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started  # the API applies migrations before the worker claims anything
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s  # lets the current job finish on `docker compose stop`
    volumes:
      - sandbox_jobs:/sandbox-jobs
    restart: unless-stopped

  # The executor (Phase 1, RD-30): the only service with access to Docker. It runs each execution job in a fresh,
  # locked-down container from the runner image. It gets the database URL and nothing else from .env: no signing
  # key, no encryption key, no provider keys. It publishes no ports.
  executor:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      AIDLC_DATABASE_URL: postgresql+pg8000://aidlc:aidlc@db:5432/aidlc
      AIDLC_RUNNER_IMAGE: aidlc-runner:latest
    depends_on:
      api:
        condition: service_started  # the API applies migrations first
      runner:
        condition: service_completed_successfully  # the job image exists before any job runs
    command: ["python", "-m", "app.execution.executor"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repos:/repos  # project git repositories (Phase 1b); no other service mounts them
    restart: unless-stopped

  # Builds the image execution jobs run in, then exits. The executor starts containers from it; nothing else does.
  runner:
    build:
      context: .
      dockerfile: infrastructure/docker/runner.Dockerfile
    image: aidlc-runner:latest
    network_mode: none
    entrypoint: ["true"]
    restart: "no"

  # S3-compatible object storage (RD-5). SeaweedFS, because MinIO no longer publishes public images.
  # The only identity is built at start-up from the keys in .env; anonymous requests are refused.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    environment:
      S3_ACCESS: ${AIDLC_STORAGE_ACCESS_KEY:?set AIDLC_STORAGE_ACCESS_KEY in .env}
      S3_SECRET: ${AIDLC_STORAGE_SECRET_KEY:?set AIDLC_STORAGE_SECRET_KEY in .env}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"aidlc","credentials":[{"accessKey":"%s","secretKey":"%s"}],
        "actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS" "$$S3_SECRET" > /tmp/s3.json &&
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - objects:/data
    restart: unless-stopped

  # Runs generated code. No network, read-only root, no secrets, hard limits. The job folder is its only link.
  sandbox:
    build:
      context: .
      dockerfile: infrastructure/docker/sandbox.Dockerfile
    init: true  # reaps processes orphaned by generated code
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /work:size=128m,mode=0711,nosuid,nodev,noexec
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
    volumes:
      - sandbox_jobs:/jobs
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "${AIDLC_WEB_PORT:-5173}:5173"

volumes:
  pgdata:
  repos:
  objects:
  sandbox_jobs:
