# Local development stack: PostgreSQL, API and frontend.
# Usage: copy .env.example to .env, set AIDLC_SECRET_KEY, then run `docker compose up --build`.
name: aidlc

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aidlc
      POSTGRES_PASSWORD: aidlc
      POSTGRES_DB: aidlc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidlc -d aidlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      AIDLC_DATABASE_URL: postgresql+pg8000://aidlc:aidlc@db:5432/aidlc
      AIDLC_PUBLIC_BASE_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
