# Local development stack: PostgreSQL, API and frontend.
# Usage: copy .env.example to .env, set AIDLC_SECRET_KEY, then run `docker compose up --build`.
name: aidlc

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aidlc
      POSTGRES_PASSWORD: aidlc
      POSTGRES_DB: aidlc
    ports:
      - "${AIDLC_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidlc -d aidlc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      AIDLC_DATABASE_URL: postgresql+pg8000://aidlc:aidlc@db:5432/aidlc
      AIDLC_PUBLIC_BASE_URL: http://localhost:${AIDLC_WEB_PORT:-5173}
      AIDLC_SIGNUP_MODE: ${AIDLC_SIGNUP_MODE:-shared}
      AIDLC_DEFAULT_LLM_BASE_URL: ${AIDLC_DEFAULT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      AIDLC_DEFAULT_LLM_MODEL: ${AIDLC_DEFAULT_LLM_MODEL:-qwen3-vl:4b-instruct}
      AIDLC_DEFAULT_LLM_ADAPTER: ${AIDLC_DEFAULT_LLM_ADAPTER:-openai_compatible}
      AIDLC_PROVIDER_TIMEOUT_SECONDS: ${AIDLC_PROVIDER_TIMEOUT_SECONDS:-600}
      AIDLC_SANDBOX_DIR: /sandbox-jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets a local model server on this machine be reached
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.bootstrap &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    volumes:
      - sandbox_jobs:/sandbox-jobs
    ports:
      - "${AIDLC_API_PORT:-8000}:8000"

  # Runs generated code. No network, read-only root, no secrets, hard limits. The job folder is its only link.
  sandbox:
    build:
      context: .
      dockerfile: infrastructure/docker/sandbox.Dockerfile
    init: true  # reaps processes orphaned by generated code
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /work:size=128m,mode=0711,nosuid,nodev,noexec
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
    volumes:
      - sandbox_jobs:/jobs
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "${AIDLC_WEB_PORT:-5173}:5173"

volumes:
  pgdata:
  sandbox_jobs:
